[package]
name = "remarkable-ssh"
version = "0.1.0"
edition = "2021"
description = "A framebuffer-based SSH terminal for the reMarkable 2 tablet"
license = "MIT"

# Zero external dependencies - all libc bindings are inline.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true
# NOTE: Do NOT set panic = "abort" — the panic hook in main.rs restarts
# xochitl on crash. With abort, the hook is skipped and the tablet is left
# with a blank screen and no way to recover without SSH.
